{% extends "base.html" %}

{% block titolo %}Accedi – Barber Booking{% endblock %}

{% block contenuto %}
    <div class="pagina-divisa">
        <section>
            <h1>Bentornato</h1>
            <p><small>Accedi per prenotare e vedere i tuoi appuntamenti.</small></p>
            {% if errore %}<p class="errore">{{ errore }}</p>{% endif %}
            <form method="post" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label>Email <input type="email" name="email" value="{{ email }}" required></label>
                <label>Password <input type="password" name="password" required></label>
                <button type="submit">Accedi</button>
            </form>
            <p>Non hai un account? <a href="{{ url_for('auth.registrazione') }}">Registrati</a></p>
        </section>
        <figure class="foto-laterale">
            <img src="{{ url_for('static', filename='img/accedi.jpg') }}"
                 alt="Poltrona da barbiere in pelle in un salone d'epoca" width="900" height="1350">
        </figure>
    </div>
{% endblock %}
