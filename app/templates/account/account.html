{% extends "base.html" %}

{% block titolo %}Il tuo account – Barber Booking{% endblock %}

{% block contenuto %}
    <h1>Il tuo account</h1>
    <p>{{ g.utente.nome }} {{ g.utente.cognome }} · {{ g.utente.email }} · {{ g.utente.telefono }}</p>

    <h2>Cambia la password</h2>
    {% if errore %}<p class="errore">{{ errore }}</p>{% endif %}
    <form method="post" action="{{ url_for('account.account') }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Password attuale <input type="password" name="attuale" autocomplete="current-password" required></label>
        <label>Nuova password (almeno 8 caratteri) <input type="password" name="nuova" autocomplete="new-password" required></label>
        <label>Ripeti la nuova password <input type="password" name="conferma" autocomplete="new-password" required></label>
        <button type="submit">Cambia password</button>
    </form>
{% endblock %}
